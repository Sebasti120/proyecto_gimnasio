{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard · SENA Gym</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Estilos propios de la plantilla -->
    <link rel="stylesheet" href="{% static 'assets/css/app.css' %}">
</head>
<body>

    <!-- Contenedores donde layout.js inyectará automáticamente la barra lateral y superior -->
    <div id="app-sidebar-host"></div>
    <div id="app-topbar-host"></div>

    <!-- Contenido principal de la vista -->
    <main class="main-content">
        <div class="container-fluid py-4">
            <h1 id="page-title">Dashboard</h1>
            <p id="page-subtitle">Gestión interna del gimnasio SENA</p>
            
            <!-- Aquí puedes colocar el contenido específico de tu home -->
            <div class="card p-4 shadow-sm">
                <h3>¡Bienvenido al sistema!</h3>
                <p>El entorno de Django y los recursos estáticos están configurados correctamente.</p>
            </div>
        </div>
    </main>

    <!-- Scripts de la plantilla -->
    <script src="{% static 'assets/js/app.js' %}"></script>
    <script src="{% static 'assets/js/layout.js' %}"></script>
    <script>
        // Inicializa el layout indicando que el menú activo es el dashboard
        SENA.initLayout({ active: 'dashboard' });
    </script>
</body>
</html>
